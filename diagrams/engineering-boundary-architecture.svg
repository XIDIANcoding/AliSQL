      <rect x="0" y="0" width="1140" height="720" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" /><rect x="50.0" y="30.0" width="1040.0" height="115.0" rx="10" fill="#e8eaf6" stroke="#283593" stroke-width="1.8" /><path d="M 50.0 40.0 A 10 10 0 0 1 60.0 30.0 L 1080.0 30.0 A 10 10 0 0 1 1090.0 40.0 L 1090.0 60.0 L 50.0 60.0 Z" fill="#283593" opacity="0.14" /><text x="68.0" y="50.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#283593">1. 管控面与治理控制中心 (Control Plane - 独立 Web/微服务部署)</text><rect x="50.0" y="165.0" width="1040.0" height="120.0" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="1.8" /><path d="M 50.0 175.0 A 10 10 0 0 1 60.0 165.0 L 1080.0 165.0 A 10 10 0 0 1 1090.0 175.0 L 1090.0 195.0 L 50.0 195.0 Z" fill="#e65100" opacity="0.14" /><text x="68.0" y="185.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#e65100">2. 新增外部独立服务矩阵 (External Services - 容器化/K8s/微服务部署，避免阻塞内核)</text><rect x="50.0" y="350.0" width="1040.0" height="210.0" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.8" /><path d="M 50.0 360.0 A 10 10 0 0 1 60.0 350.0 L 1080.0 350.0 A 10 10 0 0 1 1090.0 360.0 L 1090.0 380.0 L 50.0 380.0 Z" fill="#0288d1" opacity="0.14" /><text x="68.0" y="370.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0288d1">3. 数据库内核修改与增强范围 (DB Kernel - C++/Rust 数据面核心进程代码)</text><rect x="50.0" y="580.0" width="1040.0" height="110.0" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8" /><path d="M 50.0 590.0 A 10 10 0 0 1 60.0 580.0 L 1080.0 580.0 A 10 10 0 0 1 1090.0 590.0 L 1090.0 610.0 L 50.0 610.0 Z" fill="#2e7d32" opacity="0.14" /><text x="68.0" y="600.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2e7d32">4. 存储与硬件基础设施 (Storage &amp; Infrastructure)</text><rect x="75.0" y="70.0" width="230.0" height="60.0" rx="8" fill="#ffffff" stroke="#283593" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="190.0" y="97.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#283593" text-anchor="middle">Semantic View 语义配置中心</text><text x="190.0" y="112.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(指标公式/口径/同义词可视化定义)</text><rect x="330.0" y="70.0" width="235.0" height="60.0" rx="8" fill="#ffffff" stroke="#283593" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="447.5" y="97.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#283593" text-anchor="middle">Agent 沙箱与分支管理器</text><text x="447.5" y="112.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(Fork Database/快照/配额/生命周期)</text><rect x="590.0" y="70.0" width="235.0" height="60.0" rx="8" fill="#ffffff" stroke="#283593" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="707.5" y="97.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#283593" text-anchor="middle">Model &amp; Key Vault 秘钥中心</text><text x="707.5" y="112.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(托管 LLM API Key / 本地私有模型端点)</text><rect x="845.0" y="70.0" width="220.0" height="60.0" rx="8" fill="#ffffff" stroke="#283593" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="955.0" y="97.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#283593" text-anchor="middle">全链路 AI 审计与 Tracing 日志</text><text x="955.0" y="112.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(记录 Prompt/SQL/延迟/Token 消耗)</text><rect x="75.0" y="205.0" width="230.0" height="65.0" rx="8" fill="#ffffff" stroke="#e65100" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="190.0" y="226.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#e65100" text-anchor="middle">MCP Server 协议网关</text><text x="190.0" y="242.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">[独立微服务 - Go/Node.js]</text><text x="190.0" y="257.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">对外暴露 SSE/HTTP 工具端点</text><rect x="330.0" y="205.0" width="245.0" height="65.0" rx="8" fill="#ffffff" stroke="#e65100" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="452.5" y="226.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#e65100" text-anchor="middle">AI 模型推理代理服务 (Model Gateway)</text><text x="452.5" y="242.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">[同机 Sidecar / 独立 Daemon 进程]</text><text x="452.5" y="257.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">连接池/熔断/调度 OpenAI/Qwen/vLLM</text><rect x="600.0" y="205.0" width="235.0" height="65.0" rx="8" fill="#ffffff" stroke="#e65100" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="717.5" y="226.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#e65100" te