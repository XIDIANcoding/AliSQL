<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 590" width="100%" height="auto">
      <rect x="0" y="0" width="1140" height="590" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" /><rect x="60.0" y="95.0" width="1020.0" height="155.0" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.8" /><path d="M 60.0 105.0 A 10 10 0 0 1 70.0 95.0 L 1070.0 95.0 A 10 10 0 0 1 1080.0 105.0 L 1080.0 127.0 L 60.0 127.0 Z" fill="#1565c0" opacity="0.12" /><text x="78.0" y="116.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1565c0">1. PolarDB 计算集群 (一写多读架构，标准 MySQL 协议)</text><rect x="60.0" y="275.0" width="1020.0" height="110.0" rx="10" fill="#fff8e1" stroke="#f57f17" stroke-width="1.8" /><path d="M 60.0 285.0 A 10 10 0 0 1 70.0 275.0 L 1070.0 275.0 A 10 10 0 0 1 1080.0 285.0 L 1080.0 307.0 L 60.0 307.0 Z" fill="#f57f17" opacity="0.12" /><text x="78.0" y="296.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f57f17">2. Agent Lakebase 工作空间基础设施 (2026 全新能力)</text><rect x="60.0" y="410.0" width="1020.0" height="110.0" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8" /><path d="M 60.0 420.0 A 10 10 0 0 1 70.0 410.0 L 1070.0 410.0 A 10 10 0 0 1 1080.0 420.0 L 1080.0 442.0 L 60.0 442.0 Z" fill="#2e7d32" opacity="0.12" /><text x="78.0" y="431.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2e7d32">3. 共享分布式存储底座 (PolarStore &amp; 外部 OSS 湖存储)</text><rect x="60.0" y="30.0" width="1020.0" height="40.0" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="570.0" y="55.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">业务系统 &amp; 智能体集群 (Agent Fleet / 销售助手 / 营销决策)</text><rect x="90.0" y="140.0" width="220.0" height="85.0" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="200.0" y="171.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#1565c0" text-anchor="middle">主节点 (Primary TP)</text><text x="200.0" y="187.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">高并发在线事务写入</text><text x="200.0" y="203.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">生成 Redo 日志</text><path d="M 330.0 167.5 L 432.0 167.5 L 432.0 155.0 L 450.0 180.0 L 432.0 205.0 L 432.0 192.5 L 330.0 192.5 Z" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5" /><text x="381.0" y="175.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">内存流式解析</text><text x="381.0" y="190.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">毫秒级 Redo 同步</text><text x="381.0" y="205.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">(零 ETL 搬迁)</text><rect x="470.0" y="140.0" width="260.0" height="85.0" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="600.0" y="171.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#1565c0" text-anchor="middle">只读列存节点 (IMCI AP)</text><text x="600.0" y="187.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">内存列存加速 / 向量化执行</text><text x="600.0" y="203.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">内置 HGraph 向量检索算法</text><rect x="755.0" y="140.0" width="295.0" height="85.0" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="902.5" y="171.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#1565c0" text-anchor="middle">PolarDB for AI 节点</text><text x="902.5" y="187.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">库内模型推理 (In-DB)</text><text x="902.5" y="203.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">内置通义千问 / MLOps 特征工程</text><rect x="90.0" y="315.0" width="290.0" height="50.0" rx="8" fill="#ffffff" stroke="#f57f17" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="235.0" y="337.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#f57f17" text-anchor="middle">百万级 Agent 隔离空间</text><text x="235.0" y="353.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(每个 Agent 独立文件系统视图)</text><rect x="420.0" y="315.0" width="290.0" height="50.0" rx="8" fill="#ffffff" stroke="#f57f17" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="565.0" y="337.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#f57f17" text-anchor="middle">嵌入式组件原生支持</text><text x="565.0" y="353.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(SQLite / DuckDB / LanceDB / Parquet)</text><rect x="750.0" y="315.0" width="300.0" height="50.0" rx="8" fill="#ffffff" stroke="#f57f17" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="900.0" y="337.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#f57f17" text-anchor="middle">Agent 级生命周期管理</text><text x="900.0" y="353.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(秒级快照 / 秒级克隆与回滚恢复)</text><rect x="90.0" y="450.0" width="450.0" height="50.0" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="315.0" y="472.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#2e7d32" text-anchor="middle">PolarStore 共享块存储</text><text x="315.0" y="488.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">RDMA 高速互联 / 存算分离 / 物理一份数据</text><rect x="580.0" y="450.0" width="470.0" height="50.0" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="815.0" y="472.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#2e7d32" text-anchor="middle">OSS 对象存储 &amp; 数据湖加速</text><text x="815.0" y="488.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">大容量多模态非结构化文件统一管理</text>
