<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" width="100%" height="auto">
      <rect x="0" y="0" width="1140" height="660" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" /><rect x="50.0" y="80.0" width="1040.0" height="155.0" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.8" /><path d="M 50.0 90.0 A 10 10 0 0 1 60.0 80.0 L 1080.0 80.0 A 10 10 0 0 1 1090.0 90.0 L 1090.0 110.0 L 50.0 110.0 Z" fill="#1565c0" opacity="0.14" /><text x="68.0" y="100.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1565c0">1. PolarDB 计算集群 (一写多读架构，标准 MySQL 9.0 协议与 Vector 语法)</text><rect x="50.0" y="300.0" width="1040.0" height="120.0" rx="10" fill="#fff8e1" stroke="#f57f17" stroke-width="1.8" /><path d="M 50.0 310.0 A 10 10 0 0 1 60.0 300.0 L 1080.0 300.0 A 10 10 0 0 1 1090.0 310.0 L 1090.0 330.0 L 50.0 330.0 Z" fill="#f57f17" opacity="0.14" /><text x="68.0" y="320.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f57f17">2. Agent Lakebase 工作空间基础设施 (2026 全新能力 - 面向百万级 Agent 隔离运行)</text><rect x="50.0" y="485.0" width="1040.0" height="135.0" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8" /><path d="M 50.0 495.0 A 10 10 0 0 1 60.0 485.0 L 1080.0 485.0 A 10 10 0 0 1 1090.0 495.0 L 1090.0 515.0 L 50.0 515.0 Z" fill="#2e7d32" opacity="0.14" /><text x="68.0" y="505.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#2e7d32">3. 共享分布式存储底座 (PolarStore 块存储 &amp; 外部 OSS 湖存储)</text><rect x="50.0" y="25.0" width="1040.0" height="38.0" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="570.0" y="48.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">业务应用端 &amp; 智能体集群 (Agent Fleet / 销售助手 / 营销决策 / 智能客服)</text><rect x="75.0" y="125.0" width="220.0" height="85.0" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="185.0" y="156.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#1565c0" text-anchor="middle">主节点 (Primary TP)</text><text x="185.0" y="172.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">高并发在线事务写入</text><text x="185.0" y="187.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">生成 Redo 日志</text><path d="M 310.0 152.5 L 422.0 152.5 L 422.0 140.0 L 440.0 165.0 L 422.0 190.0 L 422.0 177.5 L 310.0 177.5 Z" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5" /><text x="366.0" y="158.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">内存流式解析</text><text x="366.0" y="172.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">毫秒级 Redo 同步</text><text x="366.0" y="186.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">(零 ETL 搬迁)</text><rect x="455.0" y="125.0" width="275.0" height="85.0" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="592.5" y="156.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#1565c0" text-anchor="middle">只读列存节点 (IMCI AP)</text><text x="592.5" y="172.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">内存列存加速 / 向量化执行</text><text x="592.5" y="187.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">内置 HGraph 向量检索算法</text><rect x="750.0" y="125.0" width="315.0" height="85.0" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="907.5" y="156.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#1565c0" text-anchor="middle">PolarDB for AI 节点</text><text x="907.5" y="172.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">库内模型推理 (In-DB)</text><text x="907.5" y="187.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">内置通义千问 / MLOps 特征工程</text><rect x="120.0" y="250.0" width="900.0" height="34.0" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4 2" /><polygon points="134.0,260.0 142.0,260.0 138.0,271.0" fill="#1565c0" /><polygon points="998.0,260.0 1006.0,260.0 1002.0,271.0" fill="#1565c0" /><text x="570.0" y="270.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1565c0" text-anchor="middle">层间配合：库内 AI 算子下发与沙箱上下文注入 ── SQL 直接调度 AI_PREDICT / 向量检索，驱动 Agent 工作空间</text><rect x="75.0" y="342.0" width="310.0" height="55.0" rx="8" fill="#ffffff" stroke="#f57f17" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="230.0" y="366.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#f57f17" text-anchor="middle">百万级 Agent 隔离空间</text><text x="230.0" y="382.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(每个 Agent 独立文件系统与会话视图)</text><rect x="410.0" y="342.0" width="310.0" height="55.0" rx="8" fill="#ffffff" stroke="#f57f17" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="565.0" y="366.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#f57f17" text-anchor="middle">嵌入式组件原生支持</text><text x="565.0" y="382.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(就地读写 SQLite / DuckDB / LanceDB)</text><rect x="745.0" y="342.0" width="320.0" height="55.0" rx="8" fill="#ffffff" stroke="#f57f17" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="905.0" y="366.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#f57f17" text-anchor="middle">Agent 级生命周期管理</text><text x="905.0" y="382.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(秒级快照 / 秒级克隆 / 挂载与故障回滚)</text><rect x="120.0" y="435.0" width="900.0" height="34.0" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="1.5" stroke-dasharray="4 2" /><polygon points="134.0,445.0 142.0,445.0 138.0,456.0" fill="#f57f17" /><polygon points="998.0,445.0 1006.0,445.0 1002.0,456.0" fill="#f57f17" /><text x="570.0" y="455.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#f57f17" text-anchor="middle">层间配合：共享存储底座与高速 RDMA 互联 ── 物理上仅一份数据，行存/列存/对象存储通过统一元数据管理</text><rect x="75.0" y="530.0" width="465.0" height="65.0" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="307.5" y="551.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#2e7d32" text-anchor="middle">PolarStore 共享块存储</text><text x="307.5" y="567.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">RDMA 高速互联 / 存算分离 / 物理一份数据</text><text x="307.5" y="582.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(主节点与列存节点免复制共享底层数据文件)</text><rect x="565.0" y="530.0" width="500.0" height="65.0" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="815.0" y="551.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#2e7d32" text-anchor="middle">OSS 对象存储 &amp; 数据湖加速</text><text x="815.0" y="567.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">大容量多模态非结构化文件 (图片/PDF/视频) 统一挂载</text><text x="815.0" y="582.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(结合 Object Table 与 AI Function 自动切片向量化)</text>
