150" height="18" rx="9" fill="#64748b"/><text x="76" y="255" font-size="10" font-weight="700" font-family="system-ui" fill="#fff">存储/Catalog/开放格式</text><text x="210.0" y="278" text-anchor="middle" font-size="11" font-weight="700" font-family="system-ui" fill="#64748b">PolarDB 共享存储</text><text x="210.0" y="292" text-anchor="middle" font-size="9.5" font-weight="400" font-family="system-ui" fill="#334155">一写多读；IMCI 可部署 RW、专用 AP RO</text><text x="210.0" y="306" text-anchor="middle" font-size="9.5" font-weight="400" font-family="system-ui" fill="#334155">或独立 Standby，隔离级别不同</text><text x="210.0" y="320" text-anchor="middle" font-size="9.5" font-weight="400" font-family="system-ui" fill="#334155">[P1]</text><rect x="410" y="235" width="300" height="90" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><rect x="418" y="242" width="150" height="18" rx="9" fill="#ea580c"/><text x="426" y="255" font-size="10" font-weight="700" font-family="system-ui" fill="#fff">独立计算或托管服务</text><text x="560.0" y="278" text-anchor="middle" font-size="11" font-weight="700" font-family="system-ui" fill="#ea580c">PolarDB for AI 节点</text><text x="560.0" y="292" text-anchor="middle" font-size="9.5" font-weight="400" font-family="system-ui" fill="#334155">独立计费计算节点；可含 GPU</text><text x="560.0" y="306" text-anchor="middle" font-size="9.5" font-weight="400" font-family="system-ui" fill="#334155">隔离 AI/ML 训练与推理负载</text><text x="560.0" y="320" text-anchor="middle" font-size="9.5" font-weight="400" font-family="system-ui" fill="#334155">[P4][P5]</text><rect x="760" y="235" width="300" height="90" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><rect x="768" y="242" width="150" height="18" rx="9" fill="#ea580c"/><text x="776" y="255" font-size="10" font-weight="700" font-family="system-ui" fill="#fff">独立计算或托管服务</text><text x="910.0" y="278" text-anchor="middle" font-size="11" font-weight="700" font-family="system-ui" fill="#ea580c">PolarDB for AI Serverless / VNode</text><text x="910.0" y=