ext-anchor="middle">Auto-Routing 意图分类 / 原生 MCP 端点</text><rect x="330.0" y="75.0" width="345.0" height="80.0" rx="8" fill="#ffffff" stroke="#0288d1" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="502.5" y="104.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#0288d1" text-anchor="middle">工具 A: Cortex Analyst</text><text x="502.5" y="119.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">结构化数据高精度 Text-to-SQL</text><text x="502.5" y="135.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">绑定 Horizon 语义视图 (消除幻觉 SQL，准确率 &gt;90%)</text><rect x="695.0" y="75.0" width="370.0" height="80.0" rx="8" fill="#ffffff" stroke="#0288d1" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="880.0" y="104.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#0288d1" text-anchor="middle">工具 B: Cortex Search &amp; Analytical Search</text><text x="880.0" y="119.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">Layer 1: 自适应深度候选集剪枝召回</text><text x="880.0" y="135.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">Layer 2: AI_FILTER / AI_EXTRACT / AI_AGG 库内算子分析</text><rect x="120.0" y="195.0" width="900.0" height="34.0" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5" stroke-dasharray="4 2" /><polygon points="134.0,206.0 142.0,206.0 138.0,217.0" fill="#0288d1" /><polygon points="998.0,206.0 1006.0,206.0 1002.0,217.0" fill="#0288d1" /><text x="570.0" y="216.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0288d1" text-anchor="middle">层间配合：语义驱动与政策校验 ── Cortex Analyst 读取语义模型生成 SQL，PDP 实时拦截越权与敏感数据</text><rect x="75.0" y="290.0" width="310.0" height="65.0" rx="8" fill="#ffffff" stroke="#512da8" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="230.0" y="311.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#512da8" text-anchor="middle">Semantic Views (语义即代码)</text><text x="230.0" y="327.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">指标公式 / 维度关系 / 同义词声明</text><text x="230.0" y="342.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(统一业务口径，支撑 AI 精准理解)</text><rect x="410.0" y="290.0" width="310.0" height="65.0" rx="8" fill="#ffffff" stroke="#512da8" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="565.0" y="311.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#512da8" text-anchor="middle">Policy Decision Point (PDP)</text><text x="565.0" y="327.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">动态脱敏 / 行访问策略 (Row-Access)</text><text x="565.0" y="342.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(跨 SQL 与向量查询统一生效)</text><rect x="745.0" y="290.0" width="320.0" height="65.0" rx="8" fill="#ffffff" stroke="#512da8" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="905.0" y="311.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#512da8" text-anchor="middle">Cortex AI Guardrails</text><text x="905.0" y="327.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">PII 敏感数据拦截 / Agent 运行时审计</text><text x="905.0" y="342.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(保障生成内容符合安全合规标准)</text><rect x="120.0" y="395.0" width="900.0" height="34.0" rx="6" fill="#ede7f6" stroke="#512da8" stroke-width="1.5" stroke-dasharray="4 2" /><polygon points="134.0,406.0 142.0,406.0 138.0,417.0" fill="#512da8" /><polygon points="998.0,406.0 1006.0,406.0 1002.0,417.0" fill="#512da8" /><text x="570.0" y="416.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#512da8" text-anchor="middle">层间配合：安全授权下发到无共享虚拟数仓 ── 双向读写内部表与 S3/Azure 开放 Iceberg 外部表 (物理零搬迁)</text><rect x="75.0" y="490.0" width="465.0" height="70.0" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="307.5" y="514.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#2e7d32" text-anchor="middle">虚拟仓库 (Virtual Warehouses)</text><text x="307.5" y="529.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">隔离的弹性计算资源 / 无锁多读多写</text><text x="307.5" y="545.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(支持分析与 AI 推理算力按需秒级伸缩)</text><rect x="565.0" y="490.0" width="500.0" height="70.0" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="815.0" y="514.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#2e7d32" text-anchor="middle">双向开放存储 (Open Iceberg REST Catalog)</text><text x="815.0" y="529.75" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">内部微分区专有表 + S3/Azure 开放 Iceberg 外部表</text><text x="815.0" y="545.25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">(统一格式治理，消除数据孤岛)</text>
