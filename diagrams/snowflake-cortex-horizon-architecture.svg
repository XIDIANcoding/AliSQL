<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 670" width="100%" height="auto">
      <rect x="0" y="0" width="1140" height="670" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" /><rect x="50.0" y="30.0" width="1040.0" height="155.0" rx="10" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.8" /><path d="M 50.0 40.0 A 10 10 0 0 1 60.0 30.0 L 1080.0 30.0 A 10 10 0 0 1 1090.0 40.0 L 1090.0 60.0 L 50.0 60.0 Z" fill="#0288d1" opacity="0.14" /><text x="66.0" y="50.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0288d1">1. Cortex Agents 编排与双驱动工具层  【落点：新增外部服务 / 容器化 Cortex 运行时】</text><rect x="50.0" y="250.0" width="1040.0" height="140.0" rx="10" fill="#ede7f6" stroke="#512da8" stroke-width="1.8" /><path d="M 50.0 260.0 A 10 10 0 0 1 60.0 250.0 L 1080.0 250.0 A 10 10 0 0 1 1090.0 260.0 L 1090.0 280.0 L 50.0 280.0 Z" fill="#512da8" opacity="0.14" /><text x="66.0" y="270.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#512da8">2. 统一治理控制面 (Snowflake Horizon Catalog / Apache Polaris)  【落点：管控面独立服务集群 + 元数据库】</text><rect x="50.0" y="455.0" width="1040.0" height="150.0" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8" /><path d="M 50.0 465.0 A 10 10 0 0 1 60.0 455.0 L 1080.0 455.0 A 10 10 0 0 1 1090.0 465.0 L 1090.0 485.0 L 50.0 485.0 Z" fill="#2e7d32" opacity="0.14" /><text x="66.0" y="475.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#2e7d32">3. 弹性计算与统一存储层 (Snowflake Managed Tables &amp; Apache Iceberg)  【落点：数据库内核计算节点 + 湖仓连接器 + 对象存储】</text><rect x="75.0" y="75.0" width="235.0" height="85.0" rx="8" fill="#ffffff" stroke="#0288d1" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="192.5" y="107.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#0288d1" text-anchor="middle">Cortex Agent (智能路由)</text><text x="192.5" y="122.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle">【新增外部 Agent 服务】</text><text x="192.5" y="137.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">Auto-Routing 意图分类 / 原生 MCP 端点</text><rect x="330.0" y="75.0" width="345.0" height="85.0" rx="8" fill="#ffffff" stroke="#0288d1" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="502.5" y="99.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#0288d1" text-anchor="middle">工具 A: Cortex Analyst</text><text x="502.5" y="114.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle">【新增外部 Text-to-SQL 服务】</text><text x="502.5" y="129.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">结构化数据高精度 Text-to-SQL</text><text x="502.5" y="144.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">绑定 Horizon 语义视图 (消除幻觉，准确率 &gt;90%)</text><rect x="695.0" y="75.0" width="370.0" height="85.0" rx="8" fill="#ffffff" stroke="#0288d1" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="880.0" y="99.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#0288d1" text-anchor="middle">工具 B: Cortex Search &amp; Analytical Search</text><text x="880.0" y="114.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">【独立搜索集群 + 库内分析算子】</text><text x="880.0" y="129.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">Layer 1: 自适应深度候选集剪枝召回</text><text x="880.0" y="144.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">Layer 2: AI_FILTER / AI_EXTRACT / AI_AGG 算子分析</text><rect x="100.0" y="200.0" width="940.0" height="34.0" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5" stroke-dasharray="4 2" /><polygon points="114.0,210.0 122.0,210.0 118.0,221.0" fill="#0288d1" /><polygon points="1018.0,210.0 1026.0,210.0 1022.0,221.0" fill="#0288d1" /><text x="570.0" y="220.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0288d1" text-anchor="middle">层间配合：语义驱动与政策校验 ── Cortex Analyst 读取语义模型生成 SQL，PDP 实时拦截越权与敏感数据</text><rect x="75.0" y="295.0" width="310.0" height="70.0" rx="8" fill="#ffffff" stroke="#512da8" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="230.0" y="312.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#512da8" text-anchor="middle">Semantic Views (语义即代码)</text><text x="230.0" y="327.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">【管控面语义建模模块】</text><text x="230.0" y="342.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">指标公式 / 维度关系 / 同义词声明</text><text x="230.0" y="357.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">(统一业务口径，支撑 AI 精准理解)</text><rect x="410.0" y="295.0" width="310.0" height="70.0" rx="8" fill="#ffffff" stroke="#512da8" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="565.0" y="312.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#512da8" text-anchor="middle">Policy Decision Point (PDP)</text><text x="565.0" y="327.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">【管控面策略判定引擎】</text><text x="565.0" y="342.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">动态脱敏 / 行访问策略 (Row-Access)</text><text x="565.0" y="357.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">(跨 SQL 与向量查询统一生效)</text><rect x="745.0" y="295.0" width="320.0" height="70.0" rx="8" fill="#ffffff" stroke="#512da8" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="905.0" y="312.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#512da8" text-anchor="middle">Cortex AI Guardrails</text><text x="905.0" y="327.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">【管控面内容安全模块】</text><text x="905.0" y="342.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">PII 敏感数据拦截 / Agent 运行时审计</text><text x="905.0" y="357.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">(保障生成内容符合安全合规标准)</text><rect x="100.0" y="405.0" width="940.0" height="34.0" rx="6" fill="#ede7f6" stroke="#512da8" stroke-width="1.5" stroke-dasharray="4 2" /><polygon points="114.0,415.0 122.0,415.0 118.0,426.0" fill="#512da8" /><polygon points="1018.0,415.0 1026.0,415.0 1022.0,426.0" fill="#512da8" /><text x="570.0" y="425.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#512da8" text-anchor="middle">层间配合：安全授权下发到无共享虚拟数仓 ── 双向读写内部表与 S3/Azure 开放 Iceberg 外部表 (物理零搬迁)</text><rect x="75.0" y="500.0" width="465.0" height="75.0" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="307.5" y="519.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#2e7d32" text-anchor="middle">虚拟仓库 (Virtual Warehouses)</text><text x="307.5" y="534.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">【数据库内核计算集群 / C++】</text><text x="307.5" y="549.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">隔离的弹性计算资源 / 无锁多读多写</text><text x="307.5" y="564.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">(支持分析与 AI 推理算力按需秒级伸缩)</text><rect x="565.0" y="500.0" width="500.0" height="75.0" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))" /><text x="815.0" y="519.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#2e7d32" text-anchor="middle">双向开放存储 (Open Iceberg REST Catalog)</text><text x="815.0" y="534.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle">【外部湖仓连接插件 + 底层对象存储】</text><text x="815.0" y="549.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">内部微分区专有表 + S3/Azure 开放 Iceberg 外部表</text><text x="815.0" y="564.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="middle">(统一格式治理，消除数据孤岛)</text>
    </svg>